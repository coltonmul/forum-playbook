<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Forum Playbook</title>
<!-- 404.html v1.0.0 (2026-10-07). GitHub Pages paths are case-sensitive, so a link typed as
     /Concepts/RegionalTrainingDays would 404. If the lowercase version of the path differs,
     go there before showing anything. -->
<script>
(function () {
  var p = location.pathname, lower = p.toLowerCase();
  if (lower !== p) location.replace(lower + location.search + location.hash);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F0EBE0; color: #0E0E0C;
         font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; padding: 20px; text-align: center; }
  h1 { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 900; text-transform: uppercase;
       font-size: 64px; line-height: .95; margin: 0 0 12px; }
  a { color: #B83A14; min-height: 44px; display: inline-flex; align-items: center; }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That page is not here. <a href="/">Go to the Forum Playbook home page</a></p>
  </main>
</body>
</html>
